[workspace]

[package]
name = "exact_transcendentals"
version = "0.1.0"
edition = "2021"
authors = ["QMNF Research Team"]
description = "Exact integer arithmetic for transcendental functions - no floating point"
license = "MIT OR Apache-2.0"
keywords = ["math", "transcendental", "cordic", "exact-arithmetic", "fhe"]
categories = ["mathematics", "algorithms", "no-std"]
readme = "README.md"

[features]
default = ["std"]
std = []
# Enable SIMD optimizations for CORDIC
simd = []
# Enable arbitrary precision via CRTBigInt integration
arbitrary-precision = []

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
