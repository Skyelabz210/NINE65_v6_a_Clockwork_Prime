name: '📋 Qwen Code Scheduled Issue Triage'
on:
  # schedule disabled - QWEN_API_KEY secret not configured
  # - cron: '0 * * * *'
  pull_request:
    branches:
      - 'main'
      - 'release/**/*'
    paths:
      - '.github/workflows/qwen-scheduled-triage.yml'
  push:
    branches:
      - 'main'
      - 'release/**/*'
    paths:
      - '.github/workflows/qwen-scheduled-triage.yml'
  workflow_dispatch:
concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true
defaults:
  run:
    shell: 'bash'
jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    steps:
      - name: 'Checkout the repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
      - name: 'Get Issues'
        id: 'get_issues'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea'
        with:
          github-token: '${{ secrets.GITHUB_TOKEN || github.token }}'
          result-encoding: 'json'
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            return JSON.stringify(issues.data.map(i => ({
              number: i.number,
              title: i.title,
              body: i.body,
              labels: i.labels.map(l => l.name),
              created_at: i.created_at,
              updated_at: i.updated_at,
            })));
      - name: 'Check for QWEN_API_KEY secret'
        id: 'check_secret'
        run: |
          if [ -z "${{ secrets.QWEN_API_KEY }}" ]; then
            echo "QWEN_API_KEY secret not configured. Skipping Qwen Code analysis."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 'Run Qwen Code Issue Analysis'
        id: 'qwen_issue_analysis'
        if: steps.check_secret.outputs.skip != 'true'
        uses: 'QwenLM/qwen-code-action@v1'
        env:
          GITHUB_TOKEN: ''
          ISSUES: '${{ steps.get_issues.outputs.result }}'
          openai_api_key: '${{ secrets.QWEN_API_KEY }}'
          openai_base_url: '${{ vars.QWEN_BASE_URL }}'
          openai_model: '${{ vars.QWEN_MODEL }}'
